services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cloister
      POSTGRES_PASSWORD: cloister
      POSTGRES_DB: cloister
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - '5442:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cloister']
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: cloister
      MINIO_ROOT_PASSWORD: cloister-rahasia
    volumes:
      - minio-data:/data
    ports:
      - '9010:9000'
      - '9011:9001'

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6389:6379'

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://cloister:cloister@db:5432/cloister
      DATABASE_URL_UNPOOLED: postgres://cloister:cloister@db:5432/cloister
      SERVER_AUTH_PEPPER: ${SERVER_AUTH_PEPPER:?wajib diisi}
      SALT_HMAC_SECRET: ${SALT_HMAC_SECRET:?wajib diisi}
      IP_HMAC_SECRET: ${IP_HMAC_SECRET:?wajib diisi}
      JWT_SECRET: ${JWT_SECRET:?wajib diisi}
      BLOB_LOCAL_DIR: /data/blob
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      CRON_SECRET: ${CRON_SECRET:-}
      ORIGIN: ${ORIGIN:-http://localhost:4830}
      PORT: '4830'
    volumes:
      - blob-data:/data/blob
    ports:
      - '4830:4830'

volumes:
  db-data:
  minio-data:
  blob-data:
